    .train-ball {
      width: 24px; height: 24px; border-radius: 9999px; border: 2.5px solid #ffffff;
      display: flex; align-items: center; justify-content: center; transition: transform 0.08s linear;

    #map.hide-intermediate-labels .leaflet-tooltip.station-label {

  <script>
    const googleHybridLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'], attribution: 'Map data &copy; Google', maxZoom: 20
    });
    const esriSatelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri', maxZoom: 18
    });
    const argenmapLayer = L.tileLayer('https://wms.ign.gob.ar/geoserver/gwc/service/tms/1.0.0/capabaseargenmap@EPSG%3A3857@png/{z}/{x}/{-y}.png', {
      attribution: 'IGN Argentina - Argenmap', minZoom: 3, maxZoom: 18
    });

    const map = L.map('map', { zoomControl: false, attributionControl: false, layers: [googleHybridLayer] }).setView([-24.81, -65.35], 10);
    L.control.layers({ 'Google Hybrid': googleHybridLayer, 'Esri Satélite': esriSatelliteLayer, 'Argenmap (IGN)': argenmapLayer }, null, { position: 'topright' }).addTo(map);

    let googleTileErrors = 0;
    googleHybridLayer.on('tileerror', () => {
      if (++googleTileErrors >= 6 && map.hasLayer(googleHybridLayer)) {
        map.removeLayer(googleHybridLayer);
        map.addLayer(esriSatelliteLayer);
      }
    });

    const LINE_META = {
      "Güemes → Salta":        { color: "#0284c7", ballClass: "train-ball train-ball-g-s" },
      "Salta → Güemes":        { color: "#f59e0b", ballClass: "train-ball train-ball-s-g" },
      "Salta → Campo Quijano": { color: "#10b981", ballClass: "train-ball train-ball-s-cq" },
      "Campo Quijano → Salta": { color: "#a855f7", ballClass: "train-ball train-ball-cq-s" }
    };

    const CORRIDOR_BOUNDS = [[-25.00, -65.67], [-24.63, -65.02]];

    // Estaciones oficiales del corredor Güemes – Salta – Campo Quijano
    const STATIONS = {
      "Güemes": {
        coords: [-24.669066, -65.046185],
        terminal: true,
        accentColor: "#38bdf8",
        labelDir: "right",
        labelOffset: [10, 0]
      },
      "Campo Santo (El Bordo)": {

        terminal: false,

        labelDir: "top",
        labelOffset: [0, -9]
      },

        coords: [-24.718760, -65.388013],
        terminal: false,
        labelDir: "left",
        labelOffset: [-9, 0]
      },

        coords: [-24.777147, -65.411374],
        terminal: true,
        accentColor: "#f59e0b",
        labelDir: "right",
        labelOffset: [10, 0]
      },
      "José de San Martín": {
        coords: [-24.800673, -65.447678],
        terminal: false,
        labelDir: "right",
        labelOffset: [9, 0]
      },
      "Macacha Güemes": {
        coords: [-24.830476, -65.458772],
        terminal: false,
        labelDir: "right",
        labelOffset: [9, 0]
      },
      "Pacto de los Cerrillos": {
        coords: [-24.900670, -65.491876],
        terminal: false,
        labelDir: "right",
        labelOffset: [9, 0]
      },
      "Combate de Rosario de Lerma": {
        coords: [-24.979004, -65.580940],
        terminal: false,
        labelDir: "bottom",
        labelOffset: [0, 9]
      },

        coords: [-24.913133, -65.643591],
        terminal: true,
        accentColor: "#10b981",
        labelDir: "left",
        labelOffset: [-10, 0]
      }

    // Traza oficial IGN Argentina · FC General Belgrano Ramal C13 (Güemes – Salta)
    const TRACK_GUEMES_TO_SALTA = [
      [-24.669066, -65.046185], // Güemes
      [-24.667513, -65.048107],
      [-24.660166, -65.062235],
      [-24.653860, -65.073746],

      [-24.665014, -65.098879],
      [-24.663140, -65.104470],
      [-24.663200, -65.106701], // Campo Santo (El Bordo)
      [-24.669267, -65.118241],
      [-24.681165, -65.141590],
      [-24.695709, -65.169816],
      [-24.704364, -65.196734],
      [-24.707101, -65.219577],
      [-24.707815, -65.225139], // Betania
      [-24.706684, -65.232902],

      [-24.707428, -65.265143],
      [-24.708320, -65.272103],

      [-24.709837, -65.291912],
      [-24.712276, -65.297831],
      [-24.711771, -65.302858],

      [-24.712127, -65.317343],
      [-24.713525, -65.325820],
      [-24.713972, -65.334802],
      [-24.712157, -65.341822],
      [-24.712574, -65.344945],
      [-24.711057, -65.349614],
      [-24.708528, -65.352737],
      [-24.708172, -65.359043],
      [-24.706090, -65.364307],
      [-24.705495, -65.368323],
      [-24.702253, -65.372933],

      [-24.702937, -65.378019],
      [-24.709867, -65.383105],
      [-24.714656, -65.385871],

      [-24.720991, -65.391433],

    // Traza oficial IGN Argentina · FC General Belgrano Ramales C13 + C14 (Salta – Campo Quijano)
    const TRACK_SALTA_TO_QUIJANO = [

      [-24.912491, -65.493930],

      [-24.913204, -65.642863],
      [-24.913133, -65.643591]  // Campo Quijano
    ];

    const TRACK_SALTA_TO_GUEMES = [...TRACK_GUEMES_TO_SALTA].reverse();
    const TRACK_QUIJANO_TO_SALTA = [...TRACK_SALTA_TO_QUIJANO].reverse();

    function getServicePolyline(service) {
      if (service.linea === "Güemes → Salta") return TRACK_GUEMES_TO_SALTA;
      if (service.linea === "Salta → Güemes") return TRACK_SALTA_TO_GUEMES;
      if (service.linea === "Salta → Campo Quijano") return TRACK_SALTA_TO_QUIJANO;
      return TRACK_QUIJANO_TO_SALTA;
    }

    function parseHHMM(str) {
      const [h, m] = str.split(':').map(Number);
      return h * 60 + m;
    }

    function nearestVertexIndex(pts, targetCoords) {
      let bestIdx = 0;
      let bestDist = Infinity;
      for (let i = 0; i < pts.length; i++) {
        const d = Math.hypot(pts[i][0] - targetCoords[0], pts[i][1] - targetCoords[1]);
        if (d < bestDist) {
          bestDist = d;
          bestIdx = i;
        }
      }
      return bestIdx;
    }

    function makeService(regime, linea, tren, clase, stopsList) {
      const depMins = parseHHMM(stopsList[0].time);
      const endMins = parseHHMM(stopsList[stopsList.length - 1].time);
      const duracionMin = endMins - depMins;
      const pts = getServicePolyline({ linea });
      const enrichedStops = stopsList.map((st) => ({
        name: st.name,
        time: st.time,
        elapsed: parseHHMM(st.time) - depMins,
        vertexIdx: nearestVertexIndex(pts, STATIONS[st.name].coords)
      }));

      return {
        regime,
        linea,
        tren,
        clase,
        origen: stopsList[0].name,
        destino: stopsList[stopsList.length - 1].name,
        salida: stopsList[0].time,
        llegada: stopsList[stopsList.length - 1].time,
        depMins,
        duracionMin,
        stops: enrichedStops
      };

    function formatMinutes(totalMins) {
      const m = ((Math.floor(totalMins) % 1440) + 1440) % 1440;
      return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
    }

    function formatClockWithSeconds(totalMins) {
      const totalSecs = ((Math.floor(totalMins * 60) % 86400) + 86400) % 86400;
      const hh = Math.floor(totalSecs / 3600);
      const mm = Math.floor((totalSecs % 3600) / 60);
      const ss = totalSecs % 60;
      return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
    }

    function computeSegmentHeadingDeg(p1, p2) {
      const midLatRad = (((p1[0] + p2[0]) / 2) * Math.PI) / 180;
      const dx = (p2[1] - p1[1]) * Math.cos(midLatRad);
      const dy = p2[0] - p1[0];
      if (Math.abs(dx) < 1e-12 && Math.abs(dy) < 1e-12) return 0;
      return ((Math.atan2(dx, dy) * 180) / Math.PI + 360) % 360;
    }

    function offsetLateralStarboard(pos, headingDeg, lateralMeters) {
      const rightBearingRad = ((headingDeg + 90) * Math.PI) / 180;
      const latRad = (pos[0] * Math.PI) / 180;
      const dLat = (lateralMeters * Math.cos(rightBearingRad)) / 111320;
      const dLon = (lateralMeters * Math.sin(rightBearingRad)) / (111320 * Math.max(0.2, Math.cos(latRad)));
      return [pos[0] + dLat, pos[1] + dLon];
    }

    function interpolateAlongPolyline(pts, frac) {
      if (pts.length === 1) return { pos: pts[0], headingDeg: 0 };
      const segLens = [];
      let totalLen = 0;
      for (let i = 0; i < pts.length - 1; i++) {
        const dLat = pts[i + 1][0] - pts[i][0];
        const dLon = (pts[i + 1][1] - pts[i][1]) * Math.cos(((pts[i][0] + pts[i + 1][0]) * Math.PI) / 360);
        const len = Math.hypot(dLat, dLon);
        segLens.push(len);
        totalLen += len;
      }
      const target = Math.max(0, Math.min(1, frac)) * totalLen;
      let acc = 0;
      for (let i = 0; i < segLens.length; i++) {
        if (acc + segLens[i] >= target || i === segLens.length - 1) {
          const localFrac = segLens[i] > 0 ? (target - acc) / segLens[i] : 0;
          const pA = pts[i];
          const pB = pts[i + 1];
          return {
            pos: [pA[0] + (pB[0] - pA[0]) * localFrac, pA[1] + (pB[1] - pA[1]) * localFrac],
            headingDeg: computeSegmentHeadingDeg(pA, pB)
          };
        }
        acc += segLens[i];
      }
      return { pos: pts[pts.length - 1], headingDeg: 0 };
    }

    function getElapsedIfActive(service, normalizedMins) {
      const dep = service.depMins;
      const end = dep + service.duracionMin;
      if (normalizedMins >= dep && normalizedMins <= end) {
        return normalizedMins - dep;
      }
      return null;
    }

    function getTrainPositionAtElapsed(service, elapsedMin) {
      const fullPts = getServicePolyline(service);
      const stops = service.stops;

      for (let i = 0; i < stops.length - 1; i++) {
        const sA = stops[i];
        const sB = stops[i + 1];
        if (elapsedMin >= sA.elapsed && elapsedMin <= sB.elapsed) {
          const segSpan = Math.max(0.001, sB.elapsed - sA.elapsed);
          const localFrac = Math.max(0, Math.min(1, (elapsedMin - sA.elapsed) / segSpan));
          const subPts = fullPts.slice(sA.vertexIdx, sB.vertexIdx + 1);
          const interp = interpolateAlongPolyline(subPts.length ? subPts : fullPts, localFrac);
          return {
            pos: offsetLateralStarboard(interp.pos, interp.headingDeg, 35),
            headingDeg: interp.headingDeg,
            statusText: `Próxima parada: ${sB.name} (${sB.time})`
          };
        }
      }

      const lastStop = stops[stops.length - 1];
      const endInterp = interpolateAlongPolyline(fullPts, 1);
      return {
        pos: offsetLateralStarboard(endInterp.pos, endInterp.headingDeg, 35),
        headingDeg: endInterp.headingDeg,
        statusText: `Llegando a ${lastStop.name} (${lastStop.time})`
      };
    }

    function renderNetworkGeometry() {

    const CHART_SERIES_CONFIG = [
      { key: "Güemes → Salta",        linea: "Güemes → Salta",        label: "Güemes → Salta",        strokeColor: "#0284c7", dotFill: "#0284c7", dotBorder: "#ffffff", dy: -0.9 },
      { key: "Salta → Güemes",        linea: "Salta → Güemes",        label: "Salta → Güemes",        strokeColor: "#f59e0b", dotFill: "#f59e0b", dotBorder: "#ffffff", dy: -0.3 },
      { key: "Salta → Campo Quijano", linea: "Salta → Campo Quijano", label: "Salta → C. Quijano",    strokeColor: "#10b981", dotFill: "#10b981", dotBorder: "#ffffff", dy: 0.3 },
      { key: "Campo Quijano → Salta", linea: "Campo Quijano → Salta", label: "C. Quijano → Salta",    strokeColor: "#a855f7", dotFill: "#a855f7", dotBorder: "#ffffff", dy: 0.9 }
    ];

    let evolutionSeriesCache = [];
    let chartYMax = 3;

    function countTrainsAtMinute(normalizedMins) {
      const counts = { total: 0 };
      CHART_SERIES_CONFIG.forEach((s) => { counts[s.key] = 0; });
      getActiveServices().forEach((svc) => {
        if (lineFilter !== 'ALL' && svc.linea !== lineFilter) return;
        if (getElapsedIfActive(svc, normalizedMins) !== null) {
          counts[svc.linea] = (counts[svc.linea] || 0) + 1;
          counts.total += 1;
        }
      });
      return counts;
    }

    function rebuildEvolutionCache() {
      evolutionSeriesCache = [];
      let peak = 3;
      for (let m = 0; m <= 1440; m += 1) {
        const evalMin = m === 1440 ? 1439 : m;
        const c = countTrainsAtMinute(evalMin);
        if (c.total > peak) peak = c.total;
        evolutionSeriesCache.push({ minute: m, ...c });
      }
      chartYMax = Math.max(3, peak);
    }

    function drawEvolutionChart(normalizedMins, liveCounts) {
      const canvas = document.getElementById("evolution-chart");
      const container = document.getElementById("chart-container");
      if (!canvas || !container || container.classList.contains("hidden")) return;

      const rect = container.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return;

      const dpr = window.devicePixelRatio || 1;
      const width = Math.floor(rect.width);
      const height = Math.floor(rect.height);
      if (canvas.width !== width * dpr || canvas.height !== height * dpr) {
        canvas.width = width * dpr;
        canvas.height = height * dpr;
      }

      const ctx = canvas.getContext("2d");
      ctx.save();
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, width, height);

      const padLeft = 28, padRight = 14, padTop = 18, padBottom = 20;
      const plotW = Math.max(40, width - padLeft - padRight);
      const plotH = Math.max(24, height - padTop - padBottom);

      const yMax = chartYMax;
      const xForMinute = (m) => padLeft + (m / 1440) * plotW;
      const yForValue = (v) => padTop + plotH - (v / yMax) * plotH;

      ctx.font = "600 9.5px Inter, sans-serif";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      for (let v = 0; v <= yMax; v++) {
        const y = Math.round(yForValue(v)) + 0.5;
        ctx.strokeStyle = v === 0 ? "rgba(148,163,184,0.35)" : "rgba(148,163,184,0.16)";
        ctx.lineWidth = v === 0 ? 1.1 : 0.8;
        ctx.beginPath(); ctx.moveTo(padLeft, y); ctx.lineTo(padLeft + plotW, y); ctx.stroke();
        ctx.fillStyle = "#94a3b8";
        ctx.fillText(String(v), padLeft - 6, y);
      }

      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      for (let h = 0; h <= 24; h += 3) {
        const m = h === 24 ? 1440 : h * 60;
        const x = Math.round(xForMinute(m)) + 0.5;
        ctx.strokeStyle = "rgba(148,163,184,0.16)";
        ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(x, padTop); ctx.lineTo(x, padTop + plotH); ctx.stroke();
        ctx.fillStyle = "#94a3b8";
        ctx.fillText(h === 24 ? "23:59" : `${String(h).padStart(2, "0")}:00`, x, padTop + plotH + 4);
      }

      const visibleSeries = CHART_SERIES_CONFIG.filter((s) => lineFilter === 'ALL' || s.linea === lineFilter);
      visibleSeries.forEach((s) => {
        ctx.beginPath();
        evolutionSeriesCache.forEach((pt, idx) => {
          const x = xForMinute(pt.minute);
          const y = yForValue(pt[s.key] || 0) + s.dy;
          if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.lineTo(xForMinute(1440), yForValue(0));
        ctx.lineTo(xForMinute(0), yForValue(0));
        ctx.closePath();
        ctx.fillStyle = `${s.strokeColor}22`;
        ctx.fill();

        ctx.beginPath();
        evolutionSeriesCache.forEach((pt, idx) => {
          const x = xForMinute(pt.minute);
          const y = yForValue(pt[s.key] || 0) + s.dy;
          if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.strokeStyle = s.strokeColor;
        ctx.lineWidth = 2.1;
        ctx.lineJoin = "round";
        ctx.stroke();
      });

      const cursorX = xForMinute(normalizedMins);
      ctx.save();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.6;
      ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.moveTo(cursorX, padTop - 3); ctx.lineTo(cursorX, padTop + plotH); ctx.stroke();
      ctx.restore();

      visibleSeries.forEach((s) => {
        const cy = yForValue(liveCounts[s.key] || 0) + s.dy;
        ctx.beginPath(); ctx.arc(cursorX, cy, 4.2, 0, Math.PI * 2);
        ctx.fillStyle = s.dotFill; ctx.fill();
        ctx.lineWidth = 1.6; ctx.strokeStyle = s.dotBorder; ctx.stroke();
      });

      const badgeText = `${formatMinutes(normalizedMins)} · ${liveCounts.total} tren${liveCounts.total === 1 ? "" : "es"}`;
      ctx.font = "700 9.5px Inter, sans-serif";
      const pillW = ctx.measureText(badgeText).width + 12;
      const pillX = Math.max(padLeft, Math.min(padLeft + plotW - pillW, cursorX - pillW / 2));
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath(); ctx.roundRect(pillX, 1, pillW, 15, 5); ctx.fill();
      ctx.fillStyle = "#020617"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(badgeText, pillX + pillW / 2, 9);
      ctx.restore();
    }

    function renderFrame() {
      activeMarkersLayer.clearLayers();
      const normalizedMins = ((simMinutes % 1440) + 1440) % 1440;
      document.getElementById('clock-display').textContent = formatClockWithSeconds(normalizedMins);
      document.getElementById('time-slider').value = Math.floor(normalizedMins);

      let activeCount = 0;
      getActiveServices().forEach((svc) => {
        if (lineFilter !== 'ALL' && svc.linea !== lineFilter) return;
        const elapsed = getElapsedIfActive(svc, normalizedMins);
        if (elapsed !== null) {
          const posInfo = getTrainPositionAtElapsed(svc, elapsed);
          if (!posInfo) return;
          activeCount += 1;
          const meta = LINE_META[svc.linea];
          const ballIcon = L.divIcon({
            className: '',
            html: `<div class="${meta.ballClass}" style="transform: rotate(${posInfo.headingDeg.toFixed(1)}deg);">
              <svg class="train-ball-arrow" viewBox="0 0 12 12" fill="none"><path d="M6 1L10.5 10.5L6 8.2L1.5 10.5L6 1Z" fill="#ffffff"/></svg>
            </div>`,
            iconSize: [24, 24], iconAnchor: [12, 12]
          });

          L.marker(posInfo.pos, { icon: ballIcon })
            .bindTooltip(
              `<strong>${svc.tren} · ${svc.linea}</strong><br/><span style="color:#cbd5e1;font-size:10.5px;">${svc.clase}</span><br/>${svc.origen} → ${svc.destino} (${svc.salida} – ${svc.llegada})<br/><span style="color:#fde68a;">${posInfo.statusText}</span>`,
              { direction: 'top', offset: [0, -13] }
            )
            .addTo(activeMarkersLayer);
        }
      });

      document.getElementById('active-count-pill').textContent = `${activeCount} en circulación`;
      drawEvolutionChart(normalizedMins, countTrainsAtMinute(normalizedMins));
    }

    function loop(timestamp) {
      const dtSeconds = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;
      if (isPlaying) {
        simMinutes = (simMinutes + (dtSeconds * speedMultiplier) / 60) % 1440;
        renderFrame();
      }
      requestAnimationFrame(loop);
    }

    let initialZoom = null;

    function updateIntermediateLabelsVisibility() {
      const mapEl = map.getContainer();
      if (!mapEl || initialZoom === null) return;
      const showIntermediate = map.getZoom() > initialZoom;
      mapEl.classList.toggle('hide-intermediate-labels', !showIntermediate);
    }

    window.addEventListener('load', () => {
      updateRegimeCountsUI();
      rebuildEvolutionCache();
      renderNetworkGeometry();
      fitMapBounds(false);
      initialZoom = map.getZoom();
      updateIntermediateLabelsVisibility();

      map.on('zoomend', updateIntermediateLabelsVisibility);

      window.addEventListener('resize', () => { fitMapBounds(false); updateIntermediateLabelsVisibility(); renderFrame(); });

      document.querySelectorAll('.regime-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          activeRegime = btn.getAttribute('data-regime');
          document.querySelectorAll('.regime-btn').forEach((b) => {
            const isSelected = b.getAttribute('data-regime') === activeRegime;
            if (isSelected) {
              b.className = 'regime-btn inline-flex items-center gap-1.5 text-[10.5px] sm:text-xs font-extrabold uppercase tracking-wider px-2.5 sm:px-3 py-1 rounded-full bg-sky-400 text-slate-950 border border-sky-200 shadow transition cursor-pointer';
              b.querySelector('span:first-child').className = 'w-2 h-2 rounded-full bg-slate-950 inline-block';
            } else {
              const r = b.getAttribute('data-regime');
              const dotColor = r === 'sunday' ? 'bg-slate-400' : (r === 'saturday' ? 'bg-amber-400' : 'bg-sky-400');
              b.className = 'regime-btn inline-flex items-center gap-1.5 text-[10.5px] sm:text-xs font-extrabold uppercase tracking-wider px-2.5 sm:px-3 py-1 rounded-full bg-white/10 hover:bg-white/15 text-slate-300 border border-white/20 transition cursor-pointer';
              b.querySelector('span:first-child').className = `w-2 h-2 rounded-full ${dotColor} inline-block`;
            }
          });
          updateRegimeCountsUI();
          rebuildEvolutionCache();
          renderNetworkGeometry();
          renderFrame();
        });
      });

      document.getElementById('toggle-chart-btn').addEventListener('click', (e) => {
        const container = document.getElementById('chart-container');
        const isHidden = container.classList.toggle('hidden');
        e.target.textContent = isHidden ? 'Ver gráfico 24h' : 'Ocultar gráfico';
        fitMapBounds(true);
        if (!isHidden) renderFrame();
      });

      const evoCanvas = document.getElementById('evolution-chart');
      const evoTooltip = document.getElementById('chart-hover-tooltip');
      function minuteFromCanvasEvent(e) {
        const rect = evoCanvas.getBoundingClientRect();
        const plotW = Math.max(40, rect.width - 42);
        return Math.round((Math.max(0, Math.min(plotW, e.clientX - rect.left - 28)) / plotW) * 1439);
      }

      evoCanvas.addEventListener('click', (e) => { simMinutes = minuteFromCanvasEvent(e); renderFrame(); });
      evoCanvas.addEventListener('mousemove', (e) => {
        const hoverMin = minuteFromCanvasEvent(e);
        const counts = countTrainsAtMinute(hoverMin);
        const rect = evoCanvas.getBoundingClientRect();
        const localX = e.clientX - rect.left;
        const rows = CHART_SERIES_CONFIG.filter((s) => lineFilter === 'ALL' || s.linea === lineFilter).map((s) =>
          `<div class="flex items-center justify-between gap-3"><span class="inline-flex items-center gap-1.5"><span style="width:8px;height:8px;border-radius:9999px;display:inline-block;background:${s.dotFill};border:1.5px solid #fff;"></span><span>${s.label}</span></span><strong>${counts[s.key] || 0}</strong></div>`
        ).join('');
        evoTooltip.innerHTML = `<div class="font-bold text-white border-b border-white/15 pb-0.5 mb-1">${formatMinutes(hoverMin)} · Total: ${counts.total}</div>${rows}`;
        evoTooltip.style.left = `${Math.max(8, localX > rect.width - 210 ? localX - 200 : localX + 12)}px`;
        evoTooltip.style.top = `6px`;
        evoTooltip.classList.remove('hidden');
      });
      evoCanvas.addEventListener('mouseleave', () => evoTooltip.classList.add('hidden'));

      document.querySelectorAll('.line-filter-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          lineFilter = btn.getAttribute('data-filter-line');
          document.querySelectorAll('.line-filter-btn').forEach((b) => {
            if (b.getAttribute('data-filter-line') === lineFilter) b.classList.add('bg-white/15', 'text-white', 'font-bold', 'ring-1', 'ring-white/30');
            else b.classList.remove('bg-white/15', 'text-white', 'font-bold', 'ring-1', 'ring-white/30');
          });
          rebuildEvolutionCache();
          renderNetworkGeometry();
          renderFrame();
        });
      });

      document.getElementById('clock-toggle-btn').addEventListener('click', () => {
        isPlaying = !isPlaying;
        document.getElementById('play-state-badge').textContent = isPlaying ? '❚❚' : '▶';
      });

      document.querySelectorAll('.speed-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          speedMultiplier = Number(btn.getAttribute('data-speed'));
          document.querySelectorAll('.speed-btn').forEach((b) => {
            b.className = Number(b.getAttribute('data-speed')) === speedMultiplier
              ? 'speed-btn text-[10px] font-extrabold px-2 sm:px-2.5 py-0.5 rounded-full bg-sky-500/30 text-sky-200 border border-sky-400/50 cursor-pointer transition'
              : 'speed-btn text-[10px] font-bold px-2 sm:px-2.5 py-0.5 rounded-full text-slate-300 hover:text-white cursor-pointer transition';
          });
        });
      });

      document.getElementById('time-slider').addEventListener('input', (e) => {
        simMinutes = Number(e.target.value);
        renderFrame();
      });

      renderFrame();
      lastTimestamp = performance.now();
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
